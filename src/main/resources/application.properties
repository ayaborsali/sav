spring.application.name=sav-backend

# Port fourni par la plateforme (Railway, Render) ; 8080 en local.
server.port=${PORT:8080}

# Fichier .env local (non versionné) : fournit DB_PASSWORD, JWT_SECRET, ...
spring.config.import=optional:file:.env[.properties]

# Aucun profil actif => profil « local » par défaut (dev) : le fichier non versionné
# src/main/resources/application-local.properties apporte alors les valeurs de dev.
# En production : SPRING_PROFILES_ACTIVE=prod + variables d'environnement uniquement.
spring.profiles.default=local

# =====================================================================
# Base de données PostgreSQL — secrets : variables d'environnement seules.
# Le second niveau (${local.*}) n'est défini QUE dans application-local.properties.
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sav_db}
spring.datasource.username=${DB_USERNAME:sav_user}
spring.datasource.password=${DB_PASSWORD:${local.db.password:}}

# =====================================================================
# Schéma : Flyway crée/évolue la base, Hibernate ne fait que vérifier.
# =====================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Base de dev déjà existante (sans table flyway_schema_history) : on la considère
# déjà au version 1 => V1__init.sql n'y est PAS rejoué, les données sont conservées.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=etat initial (avant Flyway)
spring.flyway.validate-migration-naming=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Accepter les rôles Angular en minuscules (ex: "gestionnaire_sav" → GESTIONNAIRE_SAV)
spring.jackson.mapper.accept-case-insensitive-enums=true

# =====================================================================
# JWT et CORS
# =====================================================================
app.jwt.secret=${JWT_SECRET:${local.jwt.secret:}}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# =====================================================================
# Premier administrateur (créé seulement si la table users est vide)
# =====================================================================
app.admin.email=${ADMIN_EMAIL:admin@higerbus.tn}
app.admin.password=${ADMIN_PASSWORD:${local.admin.password:}}

# =====================================================================
# Serveur de messagerie (SMTP) — identifiants : variables d'environnement seules.
# =====================================================================
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:${local.mail.username:}}
spring.mail.password=${MAIL_PASSWORD:${local.mail.password:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =====================================================================
# Application
# =====================================================================
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# Mot de passe oublié
app.reset.expiration-minutes=${RESET_EXPIRATION_MINUTES:30}

# Durée des sessions
app.session.normal-hours=${SESSION_NORMAL_HOURS:8}
app.session.remember-days=${SESSION_REMEMBER_DAYS:30}

# =====================================================================
# Prestataire (partie « prestataire » du contrat de maintenance). Le contrat de ce
# portail n'est pas un acte de vente : Saphir entretient les bus que le client lui
# confie. Les cles app.vendor.* restent nommees « vendor » (elles designent l'identite
# legale de la maison, pas une notion comptable). Identite legale = donnees
# metier, pas un secret : valeurs par defaut realistes, surcharges par variable
# d'environnement en production. Le PDF du contrat les reprend telles quelles.
# Le nom est écrit en échappements \\u car un fichier .properties se lit en ISO-8859-1 :
# un « é » écrit directement ressortirait en caractères cassés sur le document.
# =====================================================================
app.vendor.name=${VENDOR_NAME:Saphir V\u00E9hicules et Automobiles}
app.vendor.address=${VENDOR_ADDRESS:Nouvelle Zone Industrielle Cit\u00E9 Ettaamir, 4000 Sousse, Tunisie}
app.vendor.trade-register=${VENDOR_TRADE_REGISTER:}
app.vendor.tax-id=${VENDOR_TAX_ID:}
app.vendor.representative=${VENDOR_REPRESENTATIVE:}
app.vendor.bank-iban=${VENDOR_BANK_IBAN:}

# =====================================================================
# Contrat de maintenance : parametres des clauses standard (rédaction appliquée quand une
# clause est vide). TJ = taux juridique TVA, identique a celui des totaux.
# =====================================================================
# Délai standard de restitution du véhicule au client apres son passage a l'atelier,
# en jours ouvrables (article 2 — prestations et delais d'intervention).
app.contract.delivery-days=${CONTRACT_DELIVERY_DAYS:60}
# Garantie des travaux : main-d'oeuvre et pieces remplacees (article 3).
# A baisser si le contrat ne couvre que la prestation et non le vehicule neuf.
app.contract.warranty-months=${CONTRACT_WARRANTY_MONTHS:24}
app.contract.warranty-km=${CONTRACT_WARRANTY_KM:100000}
# Juridiction competentielle en cas de litige.
app.contract.tribunal=${CONTRACT_TRIBUNAL:Tribunal de Commerce de Tunis}

# =====================================================================
# Rédassistant IA des clauses — Groq (modèle qwen3-32b). La clé n'est JAMAIS
# écrite ici : elle vient de GROQ_API_KEY (.env non versionné). Sans clé,
# la rédaction standard s'affiche et l'aperçu/PDF restent disponibles.
# =====================================================================
app.ai.groq.enabled=true
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
# Modele demande au compte Groq : « qwen/qwen3.8-27b » est le Qwen servi par cette cle
# (catalogue verifie le 16/10/2026). GROQ_MODEL permet de changer sans recompacter.
app.ai.groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}
app.ai.groq.temperature=${GROQ_TEMPERATURE:0.3}
app.ai.groq.max-tokens=${GROQ_MAX_TOKENS:900}
app.ai.groq.timeout-seconds=${GROQ_TIMEOUT_SECONDS:45}
# Quota glissant par utilisateur (fenêtre 60 s) : evite les appels couteux répétés.
app.ai.groq.requests-per-minute=${GROQ_REQUESTS_PER_MINUTE:8}
# Les scripts metier (redaction IA, mise en page du PDF) sont ecrits en Python et lances par
# Java comme des processus externes, comme la detection de plaque. Chemin de python si
# « python » ne suffit pas ; une seule valeur pour les deux scripts.
app.python.executable=${PYTHON_EXECUTABLE:python}
app.ai.groq.script=${GROQ_DRAFT_SCRIPT:./scripts/draft_clause.py}

# =====================================================================
# Contrat imprimable : la mise en page PDF est faite par scripts/render_contract_pdf.py
# (reportlab). Java calcule les montants et les clauses, Python ne pose que du texte sur la
# page. Sans reportlab installee, l'application demarre et le telechargement du PDF explique
# la commande a lancer.
# =====================================================================
app.pdf.script=${PDF_SCRIPT:./scripts/render_contract_pdf.py}
app.pdf.timeout-seconds=${PDF_TIMEOUT_SECONDS:30}

# =====================================================================
# Lecture du n° de châssis (VIN) sur une photo : scripts/detect_vin.py appelle le modèle
# vision de Groq avec la même cle que la redaction des clauses. Aucun OCR local (numpy/torch
# sont bloques par une strategie Windows sur ce poste) : la lecture est faite par le modele,
# Java valide le format ISO 3779 (17 caracteres, sans I, O, Q) avant toute proposition.
# =====================================================================
app.vin.script=${VIN_SCRIPT:./scripts/detect_vin.py}
# Modele vision : par defaut celui des clauses, verifie disponible pour cette cle.
app.vin.model=${VIN_MODEL:${app.ai.groq.model}}
app.vin.timeout-seconds=${VIN_TIMEOUT_SECONDS:90}
# Une photo de 2000 px coute environ 2 300 jetons d'entree ; le palier gratuit est limite
# a 7 000 jetons/minute. Trois lectures par minute et par utilisateur laissent de la marge.
app.vin.requests-per-minute=${VIN_REQUESTS_PER_MINUTE:3}
app.vin.max-image-bytes=${VIN_MAX_IMAGE_BYTES:3500000}

# =====================================================================
# Depannage : les images d'une sortie sont stockees sur le disque, pas en base.
# Le dossier est relatif au repertoire de lancement du backend (sav-backend).
# Une sortie partie plus de X heures et toujours dehors est signalee a l'ecran.
# =====================================================================
app.depannage.photos-dir=${DEPANNAGE_PHOTOS_DIR:./data/photos}
# Une photo d'appareil recent depasse rarement 6 Mo ; au dela, on demande un recadrage
# plutot que de saturer le poste. La limite Spring (multipart) doit rester plus haute.
app.depannage.max-photo-bytes=${DEPANNAGE_MAX_PHOTO_BYTES:8000000}
# Lecture EXIF par scripts/read_exif.py (bibliotheque standard Python seule) : une heure
# d'appareil absente n'empeche pas le versement, elle est seulement signalee.
app.depannage.exif-script=${DEPANNAGE_EXIF_SCRIPT:./scripts/read_exif.py}
app.depannage.exif-timeout-seconds=${DEPANNAGE_EXIF_TIMEOUT_SECONDS:15}
app.depannage.long-running-hours=${DEPANNAGE_LONG_RUNNING_HOURS:8}
# Le bon d'intervention est mis en page par un script Python, comme le contrat, avec sa propre
# cle : on peut changer la pose d'un bon sans toucher au contrat. Sans reportlab, le telechargement
# du PDF repond 503 avec la commande a lancer ; l'application tourne normalement a cote de ca.
app.depannage.pdf-script=${DEPANNAGE_PDF_SCRIPT:./scripts/render_intervention_pdf.py}
app.depannage.pdf-timeout-seconds=${DEPANNAGE_PDF_TIMEOUT_SECONDS:30}

# =====================================================================
# Prime d'intervention : la regle de calcul est annoncee a l'avance et
# affichee avec le montant. Le plafond evite qu'une sortie oubliee ouverte
# (retour jamais enregistre, heure rectifiee) ne se paie comme une semaine.
# L'arrondi se fait au quart d'heure le plus proche, jamais saisi.
# =====================================================================
app.depannage.max-paid-hours=${DEPANNAGE_MAX_PAID_HOURS:12}

# =====================================================================
# Delai promis au client (module Missions) : la montre du volet Demandes
# part de l'appel du client, ou de la date de detection du rappel, et rend
# son CHIFFRE PAR LE SERVEUR. L'ecran ne soustrait rien : deux calculs du
# meme delai, c'est deux retards differents sur la meme demande.
# 48 h vient du contrat de maintenance SNTRI signe (intervention sous 48 h).
# Une valeur nulle ou negative eteint la montre : la case affiche
# « delai non promis » au lieu d'inventer une heure que personne n'a dite.
# =====================================================================
app.sav.delai-intervention-heures=${APP_SAV_DELAI_INTERVENTION_HEURES:48}
# Les dernieres heures avant la limite sont dites « limites » (orange) plutot
# que « dans les delais » : un retard doit se voir avant de surprendre.
app.sav.delai-alerte-heures=${APP_SAV_DELAI_ALERTE_HEURES:12}

# =====================================================================
# Papier d'appel en garantie (familles Garanties) : la feuille adressee au
# constructeur est mise en page par scripts/render_claim_pdf.py (reportlab),
# comme le contrat et le bon d'intervention, avec sa propre cle pour changer
# sa pose sans toucher aux deux autres. Aucun montant n'est calcule : le
# bareme de remboursement Higer n'a jamais ete fourni, la feuille recopie ce
# que le guichet a ecrit et nomme les cases vides. Sans reportlab installee,
# le telechargement repond 503 avec la commande a lancer ; l'application
# tourne normalement a cote de ca.
# =====================================================================
app.sav.claim-pdf-script=${APP_SAV_CLAIM_PDF_SCRIPT:./scripts/render_claim_pdf.py}
app.sav.claim-pdf-timeout-seconds=${APP_SAV_CLAIM_PDF_TIMEOUT_SECONDS:30}

# =====================================================================
# Alertes (lot D4, suivi dans le temps) : ces quatre seuils sont les regles
# annoncees a l'avance. La bande "Signaux a traiter" a ete retiree de l'ecran
# Depannage et le tour automatique est coupe par defaut : ces regles restent
# appliquees par le serveur si on le redemande, rien n'est supprime en base.
# Une alerte ne se leve que par une raison ecrite ; ce qui se regle tout seul
# se ferme sans decision.
# =====================================================================
app.depannage.alert-dispatch-minutes=${DEPANNAGE_ALERT_DISPATCH_MINUTES:45}
app.depannage.alert-photo-grace-minutes=${DEPANNAGE_ALERT_PHOTO_GRACE_MINUTES:60}
app.depannage.alert-return-hours=${DEPANNAGE_ALERT_RETURN_HOURS:2}
# Le meme plafond de duree dehors que le tableau du jour : une seule regle, deux
# ecrans qui la lisent. Deux valeurs differentes finiraient par se contredire.
app.depannage.alert-scan-minutes=${DEPANNAGE_ALERT_SCAN_MINUTES:15}
# Le tour automatique ne tourne plus : il consommait un ecran que l'atelier ne
# lit pas. Pour le remettre, passer DEPANNAGE_ALERT_SCAN_ENABLED=true (ou ici
# true) et relancer le serveur -- le scan manuel POST /api/interventions/alerts/scan
# reste disponible de toute facon.
app.depannage.alert-scan-enabled=${DEPANNAGE_ALERT_SCAN_ENABLED:false}

# =====================================================================
# Rappel des paliers (module Forfaits) : le serveur compare le compteur
# connu du bus aux bornes écrites dans le catalogue, et pose une question
# quand un palier d'un forfait actif est atteint. La règle est annoncée ici
# et récitée à l'écran avec chaque liste : km OU jours depuis le début du
# forfait, le premier atteint décide ; compteur connu = le plus haut des
# chiffres du portail pour ce bus (fiche du bus, relevés du technicien en
# intervention).
# Un rappel ne bloque et ne facture rien ; il se leve par une raison ecrite.
# =====================================================================
# Minutes entre deux passes. Dix : un compteur se releve en fin de sortie, et
# l'atelier lit ce bandeau dans la journee, pas en temps reel.
app.forfaits.alert-scan-minutes=${FORFAITS_ALERT_SCAN_MINUTES:10}
# Le tour automatique du rappel des paliers est laisse ouvert, contrairement a
# celui du depannage : c'est la raison pour laquelle le module Forfaits existe —
# personne n'allait comparer l'odometre a la main. FORFAITS_ALERT_SCAN_ENABLED=false
# le coupe sans toucher au scan depannage, et le scan manuel reste disponible
# (POST /api/sold-plan-alerts/scan).
app.forfaits.alert-scan-enabled=${FORFAITS_ALERT_SCAN_ENABLED:true}

# =====================================================================
# Stockage des fichiers du portail : les photos de sortie (app.depannage.photos-dir)
# et les pièces jointes des documents de maintenance (sous <racine>/attachments).
# Une seule racine, donc un seul volume à monter en production.
#   STORAGE_DIR  : racine des fichiers, par défaut ./data relativement au
#                  répertoire de lancement. Le dossier est hors du dépôt
#                  (.gitignore) : aucun scan ne finit versionné avec le code.
# Une pièce jointe est un scan, pas un film : au-delà de 10 Mo on demande de
# réencoder la page plutôt que de saturer le poste. La limite Spring (multipart)
# reste au-dessus, sinon c'est elle qui répond et le message n'est plus en français.
# =====================================================================
app.storage.dir=${STORAGE_DIR:./data}
app.maintenance.max-attachment-bytes=${MAINTENANCE_MAX_ATTACHMENT_BYTES:10000000}

# =====================================================================
# Papiers de l'atelier imprimables : le devis, l'ordre de travail et le bon de livraison
# sortent en PDF A4 avec l'en-tete de Saphir (GET /api/maintenance/{id}/document.pdf). La
# mise en page est faite par scripts/render_maintenance_pdf.py (reportlab), comme le contrat
# et le bon d'intervention, avec sa propre cle. Java decide ce que le papier montre — seul le
# devis recoit ses totaux, l'ordre (V38) et le bon de livraison (V39) partent sans prix.
# Sans reportlab, le telechargement repond 503 avec la commande a lancer ; l'application
# tourne normalement a cote de ca, et la page d'ecran reste lisible.
# =====================================================================
app.maintenance.pdf-script=${MAINTENANCE_PDF_SCRIPT:./scripts/render_maintenance_pdf.py}
app.maintenance.pdf-timeout-seconds=${MAINTENANCE_PDF_TIMEOUT_SECONDS:30}

# =====================================================================
# Televersements (photo du chassis, piece jointe d'un dossier) : la valeur par defaut de
# Spring Boot est 1 Mo, ce qui rejetait la photo avant meme la lecture IA. Les preuves
# photo du depannage passent par la meme limite : 10 Mo laisses au fichier, la regle
# metier (8 Mo) est appliquee ensuite par le serveur, avec un message en francais.
# =====================================================================
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:12MB}

# =====================================================================
# Protection contre la force brute : RateLimitFilter (fenêtre glissante + blocage temporaire),
# sans dépendance externe. Mise à 0 = désactivé uniquement en cas de besoin réel.
# =====================================================================
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Fenêtre glissante (nombre de requêtes autorisées par fenêtre, par IP)
app.rate-limit.login.max-requests=${RATE_LIMIT_LOGIN_MAX:10}
app.rate-limit.reset.max-requests=${RATE_LIMIT_RESET_MAX:5}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
# Verrouillage temporaire après N échecs d'identification consécutifs
app.rate-limit.max-failures=${RATE_LIMIT_MAX_FAILURES:5}
app.rate-limit.lockout-minutes=${RATE_LIMIT_LOCKOUT_MINUTES:15}

# =====================================================================
# Actuator : seule la sonde de santé est publique, le reste est protégé.
# =====================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=API du portail SAV Saphir V\u00E9hicules et Automobiles

# =====================================================================
# Documentation d'API : désactivable en production avec SPRINGDOC_ENABLED=false.
# =====================================================================
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Derrière nginx (docker) : l'IP cliente est reprise de X-Forwarded-For.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
